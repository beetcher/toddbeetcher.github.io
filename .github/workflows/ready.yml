name: READY checks
on:
  push:
    paths: ['ready/**', '.github/workflows/ready.yml']
  pull_request:
    paths: ['ready/**', '.github/workflows/ready.yml']
permissions:
  contents: read
jobs:
  contracts-services-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r ready/runtime-requirements.txt -r ready/browser-requirements.txt
      - run: python ready/schemas/check.py
      - run: python -m unittest discover -s ready/tests -v
      - run: node --check ready/web/main.js
      - run: python -c "import ready.firebase_entry"
      - run: python -m playwright install --with-deps chromium
      - run: python ready/scripts/browser_check.py --artifacts /tmp/ready-browser-artifacts
      - run: python ready/scripts/browser_check.py --transport http --artifacts /tmp/ready-browser-http-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ready-browser-evidence
          path: |
            /tmp/ready-browser-artifacts
            /tmp/ready-browser-http-artifacts
          if-no-files-found: ignore
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r ready/runtime-requirements.txt
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore --project demo-ready-local --config ready/firebase.json "python ready/scripts/emulator_check.py"
