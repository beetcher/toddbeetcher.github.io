<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Phone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Left: Phone Emulator -->
    <div class="emulator-col">
      <div class="phone-frame">
        <div class="phone-top-bar">
          <div class="phone-camera"></div>
          <div class="phone-speaker"></div>
        </div>
        <div class="phone-screen">
          <!-- Task 2: Contact name / app name header -->
          <div id="phone-contact-header" class="phone-contact-header"></div>
          <div id="conversation" class="conversation"></div>
          <div class="compose-area">
            <!-- Task 3 & 4: Download + Reset tool buttons -->
            <button id="download-btn" class="tool-btn" aria-label="Download conversation" title="Download conversation">&#8595;</button>
            <button id="reset-btn" class="tool-btn" aria-label="Reset conversation" title="Reset conversation">&#8635;</button>
            <textarea id="message-input" class="message-input" placeholder="Message" rows="1"></textarea>
            <button id="send-btn" class="send-btn" aria-label="Send">&#8593;</button>
          </div>
        </div>
        <div class="phone-bottom-bar">
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>

    <!-- Task 6: Panel wrapper with collapse toggle -->
    <div class="panel-area">
      <button id="panel-toggle-btn" class="panel-toggle-btn" aria-label="Collapse developer controls" title="Toggle developer controls">&#8250;</button>

      <!-- Right: Developer Controls -->
      <div class="controls-col" id="controls-col">
        <div class="controls-header">
          <div class="controls-title">Test Phone</div>
          <div class="controls-subtitle">developer console</div>
          <!-- Task 1: Byline -->
          <div class="controls-byline">Nebagamon Development</div>
          <button type="button" id="help-btn" class="help-btn" aria-label="Help" title="Help">?</button>
          <button type="button" id="settings-gear-btn" class="settings-gear-btn" aria-label="Open routing configuration" title="Routing Configuration">&#9881;</button>
        </div>

        <!-- Task 5: My Phone Number with history dropdown -->
        <div class="control-group">
          <label for="my-number" class="control-label">My Phone Number</label>
          <div class="combo-field">
            <input type="tel" id="my-number" class="control-input" placeholder="+1 (555) 000-0000" autocomplete="off" spellcheck="false">
            <div id="my-number-dropdown" class="number-dropdown" hidden></div>
          </div>
        </div>

        <!-- Task 5: Destination Phone Number with history dropdown -->
        <div class="control-group">
          <label for="dest-number" class="control-label">Destination Phone Number</label>
          <div class="combo-field">
            <input type="tel" id="dest-number" class="control-input" placeholder="+1 (555) 000-0000" autocomplete="off" spellcheck="false">
            <div id="dest-number-dropdown" class="number-dropdown" hidden></div>
          </div>
        </div>

        <div id="status-area" class="status-area" aria-live="polite"></div>

        <div class="controls-footer">
          <span class="hint-text">Ctrl+Shift+C &mdash; routing config</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Config Editor Modal -->
  <div id="config-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Routing Configuration">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Routing Configuration</span>
        <button id="modal-close" class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <table class="config-table">
          <thead>
            <tr>
              <th>Fake Twilio Phone Number</th>
              <th>Application Webhook Endpoint</th>
              <!-- Task 2: App Name column -->
              <th>App Name</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="config-table-body"></tbody>
        </table>
        <button id="add-row-btn" class="add-row-btn">+ Add Row</button>
      </div>
      <div class="modal-footer">
        <button type="button" id="endpoints-gear-btn" class="modal-endpoints-gear" aria-label="Router endpoints" title="Router Endpoints">&#9881;</button>
        <button id="config-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="config-save-btn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/phoneNumber.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/routerConfig.js"></script>
  <script src="js/routerClient.js"></script>
  <script src="js/conversation.js"></script>
  <script src="js/routerEndpoints.js"></script>
  <script src="js/help.js"></script>
  <script src="js/configEditor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
