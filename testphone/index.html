<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Phone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Left: Phone Emulator -->
    <div class="emulator-col">
      <div class="phone-frame">
        <div class="phone-top-bar">
          <div class="phone-camera"></div>
          <div class="phone-speaker"></div>
        </div>
        <div class="phone-screen">
          <div id="conversation" class="conversation"></div>
          <div class="compose-area">
            <textarea id="message-input" class="message-input" placeholder="Message" rows="1"></textarea>
            <button id="send-btn" class="send-btn" aria-label="Send">&#8593;</button>
          </div>
        </div>
        <div class="phone-bottom-bar">
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>

    <!-- Right: Developer Controls -->
    <div class="controls-col">
      <div class="controls-header">
        <div class="controls-title">Test Phone</div>
        <div class="controls-subtitle">developer console</div>
      </div>

      <div class="control-group">
        <label for="my-number" class="control-label">My Phone Number</label>
        <input type="tel" id="my-number" class="control-input" placeholder="+1 (555) 000-0000" autocomplete="off" spellcheck="false">
      </div>

      <div class="control-group">
        <label for="dest-number" class="control-label">Destination Phone Number</label>
        <input type="tel" id="dest-number" class="control-input" placeholder="+1 (555) 000-0000" autocomplete="off" spellcheck="false">
      </div>

      <div id="status-area" class="status-area" aria-live="polite"></div>

      <div class="controls-footer">
        <span class="hint-text">Ctrl+Shift+C &mdash; routing config</span>
      </div>
    </div>
  </div>

  <!-- Config Editor Modal -->
  <div id="config-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Routing Configuration">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Routing Configuration</span>
        <button id="modal-close" class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <table class="config-table">
          <thead>
            <tr>
              <th>Fake Twilio Phone Number</th>
              <th>Application Webhook Endpoint</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="config-table-body"></tbody>
        </table>
        <button id="add-row-btn" class="add-row-btn">+ Add Row</button>
      </div>
      <div class="modal-footer">
        <button id="config-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="config-save-btn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/phoneNumber.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/routerClient.js"></script>
  <script src="js/conversation.js"></script>
  <script src="js/configEditor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
